<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Vibrant Gradient Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glowing Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }

      .floating-card-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-card-2 { animation: floatReverse 8s ease-in-out infinite; }
      .floating-card-3 { animation: floatSlow 6.5s ease-in-out infinite reverse; }
      .pulse-orb { animation: pulseGlow 4s ease-in-out infinite; }
      .connecting-line {
        stroke-dasharray: 6, 6;
        animation: dashMove 3s linear infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="18" fill="url(#bgGrad)" />

  <!-- Geometric Grid & Circuit Lines (Background) -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle class="pulse-orb" cx="150" cy="80" r="130" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle class="pulse-orb" cx="1060" cy="280" r="140" fill="#ec4899" opacity="0.2" filter="url(#glow)" />

  <!-- Animated Dynamic Background Elements: Decorative Calendar Cards & Nodes -->
  <g opacity="0.45">
    <!-- Connecting Stream Lines -->
    <path class="connecting-line" d="M 120 180 Q 220 70 380 100 T 700 80 T 1080 150" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="connecting-line" d="M 80 280 Q 320 220 540 290 T 920 250 T 1140 220" fill="none" stroke="#c084fc" stroke-width="1.5" />

    <!-- Left Floating Mini Card -->
    <g class="floating-card-1" transform="translate(60, 110)">
      <rect width="130" height="90" rx="10" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-width="1.5" />
      <rect x="15" y="15" width="22" height="6" rx="3" fill="#60a5fa" />
      <rect x="15" y="30" width="85" height="4" rx="2" fill="#93c5fd" opacity="0.6" />
      <rect x="15" y="42" width="60" height="4" rx="2" fill="#93c5fd" opacity="0.4" />
      <circle cx="22" cy="65" r="8" fill="#3b82f6" />
      <circle cx="45" cy="65" r="8" fill="#10b981" />
      <circle cx="68" cy="65" r="8" fill="#f59e0b" />
    </g>

    <!-- Right Floating Mini Card 1 -->
    <g class="floating-card-2" transform="translate(990, 60)">
      <rect width="140" height="95" rx="10" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="1.5" />
      <rect x="18" y="16" width="30" height="6" rx="3" fill="#34d399" />
      <circle cx="115" cy="20" r="4" fill="#10b981" />
      <line x1="18" y1="36" x2="120" y2="36" stroke="#059669" stroke-width="1" />
      <rect x="18" y="48" width="90" height="8" rx="4" fill="#a7f3d0" opacity="0.3" />
      <rect x="18" y="64" width="70" height="8" rx="4" fill="#34d399" opacity="0.7" />
    </g>

    <!-- Right Floating Mini Card 2 -->
    <g class="floating-card-3" transform="translate(1010, 200)">
      <rect width="130" height="85" rx="10" fill="url(#cardGrad3)" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="16" y="15" width="40" height="6" rx="3" fill="#fbbf24" />
      <rect x="16" y="32" width="95" height="4" rx="2" fill="#fde68a" opacity="0.5" />
      <rect x="16" y="44" width="80" height="4" rx="2" fill="#fde68a" opacity="0.5" />
      <rect x="16" y="58" width="55" height="14" rx="5" fill="#f59e0b" opacity="0.8" />
    </g>
  </g>

  <!-- Central Foreground Content (Guaranteed foreground & perfectly readable) -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Top Pill / Badge -->
    <rect x="-160" y="-120" width="320" height="32" rx="16" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="1.5" />
    <text class="badge-text" x="0" y="-99" fill="#e0e7ff" font-size="13" letter-spacing="1">📅 THE ULTIMATE TEAM ECOSYSTEM</text>

    <!-- Main Title -->
    <text class="title-text" x="0" y="-30" font-size="38" fill="#ffffff" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.8))">
      Awesome Team Calendar &amp; Event Planning
    </text>

    <!-- Underline Bar -->
    <rect x="-140" y="-10" width="280" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text class="subtitle-text" x="0" y="32" font-size="17" fill="#cbd5e1">
      Curated Guide to Shared Calendars, Meeting Polls, CalDAV &amp; Scheduling Automation
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 75)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text class="badge-text" x="0" y="4" fill="#94a3b8" font-size="12">⚡ SaaS Platforms</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-75, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text class="badge-text" x="0" y="4" fill="#94a3b8" font-size="12">🔓 Open-Source Tools</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(85, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text class="badge-text" x="0" y="4" fill="#94a3b8" font-size="12">🗳️ Meeting Polls</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(235, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text class="badge-text" x="0" y="4" fill="#94a3b8" font-size="12">📆 CalDAV Sync</text>
      </g>
    </g>
  </g>
</svg>
